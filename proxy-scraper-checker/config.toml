#:schema ./config-schema.json
# Конфиг для CI-прогона в elanski/proxy-preflight.
# Источники (~50) и форматы — от monosans/proxy-scraper-checker (UPSTREAM.md).
# Список проверенных прокси коммитится в корень репо как http_socks_verified.txt.

debug = false

[output]
path = "./out"
sort_by_speed = true

[output.txt]
enabled = true

[output.json]
enabled = false
include_asn = false
include_geolocation = false

[checking]
# HTTPS + полная верификация сертификата: прокси не может подделать ответ.
# Тело ответа — exit IP; сам факт полного успешного ответа и есть проверка.
check_url = "https://ipv4.icanhazip.com"

# GitHub runner: 512 параллельных проверок упираются в ulimit -n,
# бинарник сам урежет до доступного лимита FD минус 16.
max_concurrent_checks = 512

# Быстрый прогон: соединение 5с, весь ответ 10с, без ретраев.
timeout = 10.0
connect_timeout = 5.0
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"

[scraping]
max_proxies_per_source = 100000
timeout = 10.0
connect_timeout = 5.0
proxy = ""
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"

