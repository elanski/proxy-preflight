name: Collect proxies (no check)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # раз в сутки в 06:00 UTC

concurrency:
  group: proxy-preflight-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape Telegram channels
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python3 -c "
          import asyncio, os, re
          try:
              from telethon import TelegramClient
              from telethon.sessions import StringSession
          except ImportError:
              print('telethon not installed, skipping TG scraping')
              exit(0)
          API_ID = int(os.environ.get('TG_API_ID') or '0') or 0
          if not API_ID:
              print('TG_API_ID not set, skipping TG scraping')
              exit(0)
          API_HASH = os.environ['TG_API_HASH']
          SESSION = os.environ.get('TG_SESSION', '')
          # Только VLESS — фильтр по Reality+Vision будет при merge
          SCHEME_RE = re.compile(r'vless://[^\s<>\"\n]+', re.IGNORECASE)
          CHANNELS = [
              'VIPROXYS', 'v2rayfreedaily', 'vrayconfigs', 'HomayounConfigs',
              'v2rayng_configsss', 'V2ray_configs2', 'oneclickvpnkeys', 'V2RAYNG_VPNT',
              'v2rayfresh', 'config_vless', 'freeeirannet', 'v2rayng_hub',
              'Vepeer_VPN', 'nV_v2ray', 'h110vpnchat', 'sigma_smart_vpn', 'OkeyVPNfree',
          ]
          def extract(msg):
              configs = set()
              if msg.text:
                  for m in SCHEME_RE.finditer(msg.text):
                      c = m.group(0).strip().rstrip('.,|)')
                      if len(c) > 20:
                          configs.add(c)
              return configs
          async def scrape():
              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)
              await client.start()
              os.makedirs('sources_tg', exist_ok=True)
              for channel in CHANNELS:
                  configs = set()
                  try:
                      async for msg in client.iter_messages(channel, limit=500):
                          configs |= extract(msg)
                      with open(f'sources_tg/{channel}.txt', 'w') as f:
                          f.write('\n'.join(sorted(configs)))
                      print(f'{channel}: {len(configs)} configs')
                  except Exception as e:
                      print(f'Error {channel}: {e}')
              await client.disconnect()
          asyncio.run(scrape())
          "

      - name: Add TG channel files to links.txt
        run: |
          python3 -c "
          import os, glob
          tg_files = glob.glob('sources_tg/*.txt')
          if not tg_files:
              print('No TG source files found')
              exit(0)
          with open('links.txt', 'a') as out:
              out.write('\n# === telegram_channels ===\n')
              for fname in sorted(tg_files):
                  abs_path = os.path.abspath(fname)
                  out.write('file://' + abs_path + '\n')
          print('Added ' + str(len(tg_files)) + ' TG channel files to links.txt')
          "

      - name: Collect VLESS+Reality+XTLS-Vision proxies (no check)
        run: |
          mkdir -p configs
          python3 -c "
          import os, re, base64
          from urllib.parse import urlparse, parse_qs

          def is_vless_reality_vision(line):
              if not line.startswith('vless://'):
                  return False
              try:
                  parsed = urlparse(line.split()[0].split('#')[0])
                  q = parse_qs(parsed.query or '')
                  security = (q.get('security', [''])[0] or '').strip().lower()
                  flow = (q.get('flow', [''])[0] or '').strip().lower()
                  return security == 'reality' and flow == 'xtls-rprx-vision'
              except Exception:
                  return False

          def decode(text):
              stripped = text.strip()
              if 'vless://' in stripped:
                  return stripped
              try:
                  decoded = base64.b64decode(stripped + '==').decode('utf-8', errors='replace')
                  if 'vless://' in decoded:
                      return decoded
              except Exception:
                  pass
              return stripped

          import urllib.request
          proxies, seen = [], set()
          with open('links.txt') as f:
              urls = [l.strip() for l in f if l.strip() and not l.startswith('#')]

          for url in urls:
              try:
                  if url.startswith('file://'):
                      path = url[7:]
                      with open(path) as f:
                          content = f.read()
                  else:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          content = r.read().decode('utf-8', errors='replace')
                  content = decode(content)
                  for line in content.splitlines():
                      line = line.strip()
                      if is_vless_reality_vision(line):
                          base = line.split('#')[0].strip()
                          if base not in seen:
                              seen.add(base)
                              proxies.append(line)
              except Exception as e:
                  print('WARN ' + url[:60] + ': ' + str(e))

          os.makedirs('configs', exist_ok=True)
          with open('configs/collected_raw', 'w') as f:
              f.write('\n'.join(proxies))
          print('Collected ' + str(len(proxies)) + ' VLESS+Reality+XTLS-Vision proxies -> configs/collected_raw')
          "

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/collected_raw sources_tg/ links.txt || true
          git diff --staged --quiet && echo "No changes" && exit 0
          TOTAL=$(wc -l < configs/collected_raw 2>/dev/null || echo 0)
          git commit -m "chore: collected ${TOTAL} VLESS+Reality+Vision proxies (no check)"
          git push --force-with-lease || git push --force
