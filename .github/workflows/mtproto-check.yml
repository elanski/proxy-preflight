name: MTProto check

on:
  workflow_run:
    workflows: ["Speedtest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  OUTPUT_DIR: configs
  MAX_WORKERS: 500
  CONNECT_TIMEOUT: 3
  MTPROTO_ATTEMPTS: 3
  MTPROTO_MIN_SUCCESS_RATE: 0.8
  MTPROTO_TOP_N: 100
  MTPROTO_STRICT: 'true'
  AUTO_COMMENT: ' verified · proxy-preflight'

concurrency:
  group: proxy-preflight-serial
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mtproto-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Collect MTProto proxies from sources.json
        run: python3 scripts/collect_mtproto_sources.py

      - name: Check MTProto proxies
        run: |
          if [ ! -s configs/mtproto_input.txt ]; then
            echo "No MTProto proxies to check"
            exit 0
          fi
          TOTAL=$(wc -l < configs/mtproto_input.txt)
          echo "Checking $TOTAL MTProto proxies..."
          python3 -m lib.mtproto_checker configs/mtproto_input.txt \
            --top-n ${{ env.MTPROTO_TOP_N }} \
            --attempts ${{ env.MTPROTO_ATTEMPTS }} \
            --min-success-rate ${{ env.MTPROTO_MIN_SUCCESS_RATE }} \
            --timeout ${{ env.CONNECT_TIMEOUT }} \
            --workers ${{ env.MAX_WORKERS }} || echo "MTProto checker finished"

      - name: Make top100
        run: |
          if [ -f configs/mtproto ]; then
            head -n 100 configs/mtproto > "configs/mtproto(top100)"
          fi

      - name: Commit MTProto results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/mtproto "configs/mtproto(top100)" configs/mtproto_input.txt || true
          git diff --staged --quiet && echo "No changes" && exit 0
          MT=$(wc -l < configs/mtproto 2>/dev/null || echo 0)
          git commit -m "chore: ${MT} live MTProto proxies"
          git push || { git pull --rebase --autostash -q origin main && git push; }
