  - "🇷🇺"
  - "RU"
  - "Russia"
  - "Россия"
  - "Moscow"
  - "MSK"
  - "SPB"
  - "Petersburg"
  - "Ozon"
  - "WB"
  - "Yandex"
  - "vk.com"
  - "vkontakte"

