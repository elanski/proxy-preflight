# Источники свежих подписок для sing-box ядра.
#
# Категории:
#   ru    — источники, заявленные как российские (подсказка для приоритета,
#           НЕ доказательство: страна определяется только по exit_ip).
#   other — остальные/глобальные источники.
#   ru_hint_words — слова в имени узла, которые помечают кандидата как
#           «возможно RU» для приоритетной проверки. Флаг в имени НЕ является
#           доказательством российского выхода (см. proxy-pool-operations).
#
# Источники повторяют проверенную базу репозитория sources.json + несколько
# дополнительных gist-источников. Мёртвые/404 URL просто пропускаются.

